name: Reportar problema
description: Descreva um problema reproduzível no LinkWatch.
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Informe o ambiente e os passos. Remova tokens, URLs privadas e dados pessoais.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento observado
    validations:
      required: true
