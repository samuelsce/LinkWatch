name: Bug report
description: Report a reproducible LinkWatch problem.
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include environment and steps. Remove tokens, private endpoint URLs, and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
