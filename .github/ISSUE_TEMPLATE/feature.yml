name: Feature
description: Plan a LinkWatch feature with verifiable acceptance criteria.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
      description: Describe the user need and resulting behavior.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Link the relevant product requirements and describe the implementation boundary.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a checklist of observable outcomes.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Describe the tests or manual checks appropriate to this change.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking issues and technical decisions.
