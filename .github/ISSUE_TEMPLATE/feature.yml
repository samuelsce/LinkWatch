name: Propor funcionalidade
description: Planeje uma funcionalidade do LinkWatch com critérios de aceite verificáveis.
title: "[Funcionalidade] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema e resultado para o usuário
      description: Descreva a necessidade e o comportamento esperado.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo
      description: Relacione os requisitos do produto e descreva os limites da implementação.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Use uma lista de resultados observáveis.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validação
      description: Descreva os testes ou verificações manuais adequados à mudança.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependências
      description: Vincule as issues e decisões técnicas necessárias para iniciar.
