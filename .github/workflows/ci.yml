name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: linkwatch
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: linkwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkwatch -d linkwatch_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://linkwatch:test-only@localhost:5432/linkwatch_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate schema
        run: npm run db:validate
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: PostgreSQL integration tests and migrations
        run: npm run test:integration
      - name: Production build without database credentials
        run: npm run build
      - name: Install Chromium for browser tests
        run: npm exec -- playwright install --with-deps chromium
      - name: Browser journeys and tenant isolation
        run: npm run test:e2e
      - name: Production web and worker smoke test
        run: npm run test:smoke
      - name: Dependency audit
        run: npm audit --audit-level=high
