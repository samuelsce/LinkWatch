services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: linkwatch
      POSTGRES_PASSWORD: linkwatch
      POSTGRES_DB: linkwatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwatch -d linkwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
